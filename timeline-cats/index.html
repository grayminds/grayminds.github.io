s.github.io/timeline-cats/"> <script src="/assets/js/theme.js?v=5fea5159b787642c1bbc1f334d60f883"></script> <link defer rel="stylesheet" href="/assets/css/jekyll-pygments-themes-native.css?v=5847e5ed4a4568527aa6cfab446049ca" media="none" id="highlight_theme_dark"> <script>

  </script> </head> <body class="fixed-top-nav "> <header> <nav id="navbar" class="navbar navbar-light navbar-expand-sm fixed-top" role="navigation"> <div class="container"> <a class="navbar-brand title font-weight-lighter" href="/"> Michael Gray </a> <button class="navbar-toggler collapsed ml-auto" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"> <span class="sr-only">Toggle navigation</span> <span class="icon-bar top-bar"></span> <span class="icon-bar middle-bar"></span> <span class="icon-bar bottom-bar"></span> </button> <div class="collapse navbar-collapse text-right" id="navbarNav"> <ul class="navbar-nav ml-auto flex-nowrap"> <li class="nav-item "> <a class="nav-link" href="/">about </a> </li> <li class="nav-item "> <a class="nav-link" href="/blog/">blog </a> </li> <li class="nav-item "> <a class="nav-link" href="/cv/">CV </a> </li> <li class="nav-item dropdown "> <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">et cetera </a> <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown"> <a class="dropdown-item " href="/tech-stack/">Tech Stack</a> <a class="dropdown-item " href="/timeline-cats/">Timeline (Cat Tested)</a> <a class="dropdown-item " href="/labyrinthian/">Labyrinthian</a> <a class="dropdown-item " href="/skytimestudio/">Sky Time Studio</a> <a class="dropdown-item " href="/publications/">Publications</a> </div> </li> <li class="nav-item"> <button id="search-toggle" title="Search" onclick="openSearchModal()"> <span class="nav-link">ctrl k <i class="fa-solid fa-magnifying-glass"></i></span> </button> </li> <li class="toggle-container"> <button id="light-toggle" title="Change theme"> <i class="fa-half-sun-moon" id="light-toggle-system"></i> <i class="fa-solid fa-moon" id="light-toggle-dark"></i> <i class="fa-solid fa-sun" id="light-toggle-light"></i> </button> </li> </ul> </div> </div> </nav> <progress id="progress" value="0"> <div class="progress-container"> <span class="progress-bar"></span> </div> </progress> </header> <div class="container mt-5" role="main"> <div class="post"> <header class="post-header"> <h1 class="post-title">Timeline of Cats</h1> <p class="post-description">A test of timeline functionality... with my cats</p> </header> <article> <link rel="stylesheet" href="/assets/timeline/css/timeline.css"> <link rel="stylesheet" href="/assets/timeline/css/timeline-custom.css"> <script src="/assets/timeline/js/timeline.js"></script> <div id="timeline-embed" style="width:100%; height:800px;"></div> <script>
    // Raw YAML data comes in as a map; we need to extract the values into an array.
    var rawData = {"title":{"text":{"headline":"The Household Cats","text":"A chronological record of the cats who have shared my home."}},"events":{"matisse":{"start_date":{"year":1997,"month":8},"end_date":{"year":2000,"month":8},"display_date":"Atlanta (Aug 1997–Aug 2000)","text":{"headline":"Matisse","text":"Orange tabby, male.\n\nMatisse was the first cat to adopt me away from being a dog\nperson during my years renting a room with a family while in \ngrad school.  He eventually reached about nineteen years of \nage, placing his birth around 1981.\n"},"media":{"url":"/assets/img/timeline_cats/matisse.01 2001-EDIT.jpg","thumbnail":"/assets/img/timeline_cats/thumbs/matisse.01 2001-EDIT_thumb.jpg","caption":"Matisse"},"images":[{"url":"/assets/img/timeline_cats/matisse.01 2001-EDIT.jpg","caption":"Matisse"},{"url":"/assets/img/timeline_cats/matisse.02 2001-EDIT.jpg","caption":"Matisse ... and 90s computing"}]},"oscar":{"start_date":{"year":2001,"month":2},"end_date":{"year":2001,"month":12},"display_date":"Chicago (2001)","text":{"headline":"Oscar","text":"Gray tabby, male.\n\nOscar came along shortly after I arrived in Chicago.  His time\nwith me was brief but memorable.  Even though he was sickly with FIP\nhe was a sweet and affectionate cat. He was only about three when he passed.\n"},"media":{"url":"/assets/img/timeline_cats/oscar.wmg-oscar3.jpg","thumbnail":"/assets/img/timeline_cats/thumbs/oscar.wmg-oscar3_thumb.jpg","caption":"Oscar"}},"casey":{"start_date":{"year":2002,"month":4},"end_date":{"year":2011,"month":5},"display_date":"Chicago (2002–May 2011)","text":{"headline":"Casey","text":"Tabby, male.\n\nAdopted as a young kitten in Chicago, Casey quickly became part\nof the rhythm of daily life.  He adopted me first by sitting in\nmy lap.  He was the quiet one who would curl across the shoulders\n- always there, never in the way.  His loss to heart disease at\nnine was a deeply felt shock.\n"},"media":{"url":"/assets/img/timeline_cats/casey.20070413 IMG_0368.JPG","thumbnail":"/assets/img/timeline_cats/thumbs/casey.20070413 IMG_0368_thumb.JPG","caption":"Casey"}},"merlin":{"start_date":{"year":2002,"month":4},"end_date":{"year":2015,"month":11},"display_date":"Chicago and Ohio (2002–Nov 2015)","text":{"headline":"Merlin","text":"Tabby, male.\n\nMerlin and Casey came home together as littermates. Whereas\nCasey was the quiet one, Merlin was the outspoken chirper of\nbirds.  He also liked to chew cardboard boxes and groom your\nforehead ... at 3 am in the morning.\n"},"media":{"url":"/assets/img/timeline_cats/merlin.20070711.IMG_8498 Perfect Pose.crop.JPG","thumbnail":"/assets/img/timeline_cats/thumbs/merlin.20070711.IMG_8498 Perfect Pose.crop_thumb.jpg","caption":"Merlin"}},"peekaboo":{"start_date":{"year":2016,"month":1},"end_date":{"year":2050,"month":1},"display_date":"Jan 2016–Present","text":{"headline":"Peekaboo","text":"White and gray tabby, male.\n\nPeekaboo was a rehome after his first family had to move; he\ngot his name from his habit of hiding under things and only\npeeking out.  But he quickly settled in and is known to be the \nmost affectionate cat I've had.\n"},"media":{"url":"/assets/img/timeline_cats/peekaboo.20190128_131512.jpg","thumbnail":"/assets/img/timeline_cats/thumbs/peekaboo.20190128_131512_thumb.jpg","caption":"Peekaboo"},"images":[{"url":"/assets/img/timeline_cats/peekaboo.20190128_131512.jpg","caption":"Peekaboo"},{"url":"/assets/img/timeline_cats/peekaboo+kaelie.20190730_110941.jpg","caption":"Peekie and Kaelie"},{"url":"/assets/img/timeline_cats/peekaboo+kaelie.20210915_131744.jpg","caption":"Peekie and Kaelie"}]},"kaelieko":{"start_date":{"year":2018,"month":6},"end_date":{"year":2050,"month":1},"display_date":"Summer 2018–Present","text":{"headline":"Kaelieko","text":"Tortoiseshell, female.\n\nBorn December 17, 2017, she joined the household in the \nlate spring.  Never liked to be held, always squirming away,\nuntil late 2025 when now she wants her cuddles and pets.\n"},"media":{"url":"/assets/img/timeline_cats/kaelieko.20250727_103817.jpg","thumbnail":"/assets/img/timeline_cats/thumbs/kaelieko.20250727_103817_thumb.jpg","caption":"Kaelieko"},"images":[{"url":"/assets/img/timeline_cats/kaelieko.20250727_103817_thumb.jpg","caption":"Kaelieko"},{"url":"/assets/img/timeline_cats/peekaboo+kaelie.20190730_110941.jpg","caption":"Peekie and Kaelie"},{"url":"/assets/img/timeline_cats/peekaboo+kaelie.20210915_131744.jpg","caption":"Peekie and Kaelie"}]}}};

    // Build the TimelineJS payload
    var timelineData = {
      title: rawData.title || {}
    };

    // Convert events from named map to array
    if (rawData.events) {
      if (Array.isArray(rawData.events)) {
        timelineData.events = rawData.events;
      } else {
        // events is a hash/map; extract values
        timelineData.events = Object.keys(rawData.events).map(function(key) {
          return rawData.events[key];
        });
      }
    } else {
      timelineData.events = [];
    }

    
    var erasData = [{"start_date":{"year":1997,"month":8},"end_date":{"year":2000,"month":8},"text":{"headline":"The Atlanta GA Years"}},{"start_date":{"year":2000,"month":8},"end_date":{"year":2013,"month":6},"text":{"headline":"The Chicago IL Years"}},{"start_date":{"year":2013,"month":6},"end_date":{"year":2100,"month":1},"text":{"headline":"The Pickerington OH Years"}}];
    timelineData.eras = erasData;
    

    console.log('TimelineJS payload:', JSON.stringify(timelineData, null, 2));

    //window.timeline = new TL.Timeline('timeline-embed', timelineData);
    window.timeline = new TL.Timeline('timeline-embed', timelineData, {
      timenav_height: 300
    });
    //console.log('Timeline config:', window.timeline.config);

  // Build a lookup of extra images per event
  var imageData = {};
  if (rawData.events) {
    Object.keys(rawData.events).forEach(function(key) {
      var evt = rawData.events[key];
      if (evt.images && evt.images.length > 1) {
        var headline = evt.text.headline;
        imageData[headline] = {
          images: evt.images,
          current: 0
        };
      }
    });
  }

  // Attach click-to-cycle on slide change and on click
  document.getElementById('timeline-embed').addEventListener('click', function(e) {
    var img = e.target;
    if (img.tagName !== 'IMG') {
      img = e.target.querySelector('img');
    }
    if (!img) return;

    // Find current event by matching unique_id to current_id
    var currentId = window.timeline.current_id;
    var currentEvent = window.timeline.config.events.find(function(evt) {
      return evt.unique_id === currentId;
    });

    if (!currentEvent) return;

    var headline = currentEvent.text.headline;
    var data = imageData[headline];
    if (!data) return;

    data.current = (data.current + 1) % data.images.length;
    var next = data.images[data.current];

    img.src = next.url;

    var captionEl = img.closest('.tl-media')?.querySelector('.tl-caption, .tl-credit');
    if (captionEl && next.caption) {
      captionEl.textContent = next.caption;
    }

    var counter = document.getElementById('img-counter');
    if (!counter) {
      counter = document.createElement('div');
      counter.id = 'img-counter';
      counter.style.cssText = 'text-align:center; font-size:12px; color:#888; margin-top:4px;';
      img.parentElement?.appendChild(counter);
    }
    counter.textContent = (data.current + 1) + ' / ' + data.images.length;
  });
