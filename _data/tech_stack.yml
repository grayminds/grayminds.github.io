intro: >
  Each person's tech stack is a unique fingerprint driven by their specific needs.
  I wanted to share some highlights of what I am -- or have been -- working with.
  Sometimes this is enough to spark ideas in others, or to start a conversation
  over a piece of tech.

sections:
  # ============================================================
  # HOME LAB - INFRASTRUCTURE
  # ============================================================
  - id: homelab-infra
    title: "Home Lab: Infrastructure"
    type: hardware
    items:
      - vendor: Breezeline
        model: Cable Modem / ISP
        url: https://www.breezeline.com
        date:
        context:
          - home-office
        status: active
        proficiency: proficient
        sentiment: positive
        highlight: false
        tags:
          - networking
          - isp
        notes: Better priced than the competition and mostly stable. Holding until fiber becomes available.

      - vendor: Firewalla
        model: Gold SE
        url: https://firewalla.com/products/firewalla-gold-se
        date: 2025-10
        context:
          - home-office
        status: active
        proficiency: proficient
        sentiment: positive
        highlight: true
        narrative: >
          Added late 2025 to get proper network segmentation and protection around IoT devices.
          Setup was straightforward.  The main friction has been discovering limitations in existing
          network hardware that the Firewalla exposes -- a sunk-cost problem, not a Firewalla problem.
          Enabled new VLANs and significantly improved visibility into traffic across the home lab.
        tags:
          - networking
          - security
          - firewall
          - vlan
          - iot
        notes: Network segmentation, VLAN support, IoT isolation, and traffic monitoring.

      - vendor: Amplifi
        model: Alien Mesh (trio)
        url: https://store.amplifi.com/products/amplifi-alien
        date:
        context:
          - home-office
        status: active
        proficiency: proficient
        sentiment: mixed
        highlight: true
        narrative: >
          When this came out, it solved every problem I had with Netgear routers and repeaters.
          I was so impressed I installed a trio across two locations: a pair at home and a third
          at my parents' place, with an outbuilding connected via MoCA and a hardwired repeater.
          Over time my enthusiasm dropped.  Ubiquiti effectively discontinued the Amplifi line
          to push other products, and as I upskilled on networking I discovered real limitations:
          no proper VLAN support, and the "IoT network" feature is not truly isolated.
          It also forces you to reuse the same Wi-Fi password across networks.
          Would not choose it again knowing what I know now.
        tags:
          - networking
          - wifi
          - mesh
          - moca
        notes: Trio across two locations. Parents' outbuilding via MoCA and hardwired repeater. No real VLAN support.

